<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alerta Genesys</title>
</head>
<body>

<script>

const params = new URLSearchParams(window.location.search);
const state = params.get('state');

// Dispara apenas quando a ligação for encerrada
if (
    state &&
    state.toLowerCase().includes("disconnect")
) {

    // Evita múltiplas notificações para o mesmo carregamento
    const chave = "alerta-" + state;

    if (!sessionStorage.getItem(chave)) {

        sessionStorage.setItem(chave, "enviado");

        if (Notification.permission === "granted") {

            new Notification(
                "Genesys Cloud",
                {
                    body: "A ligação foi encerrada pelo cliente.",
                    requireInteraction: true
                }
            );

        } else if (Notification.permission !== "denied") {

            Notification.requestPermission().then(function(permission) {

                if (permission === "granted") {

                    new Notification(
                        "Genesys Cloud",
                        {
                            body: "A ligação foi encerrada pelo cliente.",
                            requireInteraction: true
                        }
                    );

                }

            });

        }

    }

}

</script>

</body>
</html>
