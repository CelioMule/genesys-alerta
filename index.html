<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MAPFRE ALERTA</title>
</head>
<body>

<script>

const params = new URLSearchParams(window.location.search);

const state = params.get('state');
const id = params.get('id');

console.log('Estado:', state);
console.log('Interação:', id);

if (
    state &&
    (
        state.toLowerCase().includes('disconnect')
        ||
        state.toLowerCase().includes('desconect')
    )
) {

    fetch(
        'http://localhost:9999/',
        {
            method: 'GET',
            mode: 'no-cors'
        }
    )
    .catch(error => {
        console.log('Erro:', error);
    });

}

</script>

</body>
</html>
