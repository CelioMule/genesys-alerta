<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Genesys Debug</title>

<style>
body{
    background:#111;
    color:#fff;
    font-size:24px;
    font-family:Arial;
}
.ok{
    color:#00ff66;
}
.erro{
    color:#ff6666;
}
</style>

</head>

<body>

<h2>Genesys Debug</h2>

<div id="resultado"></div>

<script>

const params = new URLSearchParams(window.location.search);

const state = params.get('state') || '';
const id = params.get('id') || '';

const estado = state.toLowerCase();

const chamadaEncerrada =
       estado.includes('disconnect')
    || estado.includes('disconnected')
    || estado.includes('desconect');

document.getElementById("resultado").innerHTML = `
Estado: ${state}<br>
ID: ${id}<br>
Horário: ${new Date().toLocaleTimeString()}<br><br>

Status Detectado:
<span class="${chamadaEncerrada ? 'ok' : 'erro'}">
${chamadaEncerrada ? 'CHAMADA ENCERRADA' : 'CHAMADA ATIVA'}
</span>
`;

console.log("State:", state);
console.log("ID:", id);
console.log("Chamada Encerrada:", chamadaEncerrada);

if (chamadaEncerrada) {

    if (Notification.permission === 'granted') {

        const notification = new Notification(
            'Genesys Cloud',
            {
                body: 'O cliente encerrou a ligação. Finalize o registro do atendimento.'
            }
        );

        setTimeout(() => {
            notification.close();
        }, 7000);

    }

}

</script>

</body>
</html>
