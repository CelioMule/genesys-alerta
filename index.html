<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Genesys Alert</title>
</head>
<body>

<script>

const params = new URLSearchParams(window.location.search);

const state = params.get('state');

if (
    state &&
    (
        state.toLowerCase().includes('disconnect') ||
        state.toLowerCase().includes('desconect')
    )
) {

    const mensagem =
        "O cliente encerrou a ligação. Finalize o registro do atendimento.";

    // Navegadores modernos
    if (
        typeof Notification !== "undefined"
    ) {

        if (
            Notification.permission === "granted"
        ) {

            const notification =
                new Notification(
                    "Genesys Cloud",
                    {
                        body: mensagem
                    }
                );

            setTimeout(() => {
                notification.close();
            }, 5000);

        }
        else if (
            Notification.permission === "default"
        ) {

            Notification.requestPermission()
            .then(permission => {

                if(permission === "granted") {

                    const notification =
                        new Notification(
                            "Genesys Cloud",
                            {
                                body: mensagem
                            }
                        );

                    setTimeout(() => {
                        notification.close();
                    }, 5000);

                }

            });

        }

    }
    // Fallback para Genesys Desktop App
    else {

        alert(mensagem);

    }

}

</script>

</body>
</html>
