<!DOCTYPE html>
<html>
<body>

<script>

const params = new URLSearchParams(window.location.search);

const state = params.get('state');

if (
    state &&
    (
        state.toLowerCase().includes('disconnect') ||
        state.toLowerCase().includes('desconect')
    )
) {

    confirm(
        "Cliente encerrou a ligação."
    );

}

</script>

</body>
</html>
