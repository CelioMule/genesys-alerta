<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Genesys Alert</title>
</head>
<body>

<script>

const params = new URLSearchParams(window.location.search);

const state = params.get('state');

if (
    state &&
    (
        state.toLowerCase().includes('disconnect') ||
        state.toLowerCase().includes('desconect')
    )
) {

    fetch('http://localhost:9999/')
    .catch(err => console.log(err));

}

</script>

</body>
</html>
